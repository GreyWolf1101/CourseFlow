name: 发布课序 Android 正式版

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 恢复发布证书
        env:
          KEYSTORE_BASE64: ${{ secrets.KEXU_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEXU_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEXU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEXU_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/kexu-release.p12"
          PROPERTIES_PATH="$RUNNER_TEMP/signing.properties"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PATH" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$PROPERTIES_PATH"
          echo "KEXU_SIGNING_PROPERTIES=$PROPERTIES_PATH" >> "$GITHUB_ENV"

      - name: 测试并构建正式版
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          RELEASE_APK="kexu-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$RELEASE_APK"
          gh release create "$GITHUB_REF_NAME" "$RELEASE_APK#课序 Android 安装包" \
            --verify-tag --generate-notes --title "课序 ${GITHUB_REF_NAME}"
